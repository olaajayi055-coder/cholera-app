<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 class="text-center mb-4">🔐 Login</h2>
        <form id="loginForm">
            <div class="mb-3"><label class="form-label">Username</label><input type="text" class="form-control" name="username" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="text-center mt-3"><a href="/register">No account? Register</a> | <a href="/">Back Home</a></div>
        <div id="message" class="mt-3"></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const res = await fetch('/login', { method: 'POST', body: new FormData(this) });
            const data = await res.json();
            if(data.success) window.location.href = '/';
            else document.getElementById('message').innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
        });
    </script>
</body>
</html>
